[project]
name = "pfcompara"
version = "0.1.0"
description = "Produto IA4Seg para análise e comparação de apólices D&O com OCR e IA Generativa."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["../PfCompara_Apoio/desenvolvimento/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "../PfCompara_Apoio/desenvolvimento/tests", "../PfCompara_Apoio/ferramentas"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
