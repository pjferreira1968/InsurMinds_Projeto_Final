services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: insurminds_projeto_final
      POSTGRES_USER: insurminds_projeto_final
      POSTGRES_PASSWORD: insurminds_projeto_final
    ports:
      - "5432:5432"
    volumes:
      - insurminds_projeto_final_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurminds_projeto_final -d insurminds_projeto_final"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://insurminds_projeto_final:insurminds_projeto_final@postgres:5432/insurminds_projeto_final
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  insurminds_projeto_final_postgres:
