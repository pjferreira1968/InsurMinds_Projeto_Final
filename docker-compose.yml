services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pfcompara
      POSTGRES_USER: pfcompara
      POSTGRES_PASSWORD: pfcompara
    ports:
      - "5432:5432"
    volumes:
      - pfcompara_postgres:/var/lib/postgresql/data
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
volumes:
  pfcompara_postgres:
